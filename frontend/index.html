<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Wikiverse is an open encyclopedia. Read, cite, discuss and edit articles across every discipline."
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Matches --surface-shell in each theme (index.css §1/§2). -->
    <meta
      name="theme-color"
      content="#f5f4f1"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#111315"
      media="(prefers-color-scheme: dark)"
    />
    <!-- Blocking on purpose: sets .dark before first paint. External, not
         inline, because the CSP allows only same-origin scripts. -->
    <script src="/theme-init.js"></script>

    <!-- The site-level card. Article URLs get their own card from the Open
         Graph shell that nginx serves to link-preview crawlers. -->
    <meta property="og:site_name" content="Wikiverse" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wikiverse — the open encyclopedia" />
    <meta
      property="og:description"
      content="An open encyclopedia with revision history, diffs, talk pages, citations and full-text search."
    />
    <meta property="og:url" content="https://wikiverse.jonasjavier.dev/" />
    <meta name="twitter:card" content="summary" />

    <!--
      Fonts are self-hosted from this origin (src/fonts.css, public/fonts/).
      The Google Fonts stylesheet and its two preconnects are deliberately
      gone: DECISIONS §7.6. Exactly two faces are preloaded — the sans that
      renders the chrome and the serif that renders the first paragraph.
      Mono and italic are not on any first-paint critical path.
    -->
    <link
      rel="preload"
      href="/fonts/inter-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/source-serif-4-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>Wikiverse — the open encyclopedia</title>
  </head>
  <body class="h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
